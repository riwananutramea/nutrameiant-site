<!DOCTYPE html>
<html lang="{{lang}}" dir="{{dir}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{base}}assets/tokens.css">
<link rel="stylesheet" href="{{base}}assets/site.css">
</head>
<body>
<a class="btn btn-secondary skip-link" href="#main">{{skip}}</a>

<header class="site-header">
  <div class="wrap">
    <a class="logo" href="{{home}}" aria-label="{{homeLabel}}">
      <svg viewBox="0 0 200 60" xmlns="http://www.w3.org/2000/svg" role="img" aria-hidden="true" focusable="false">
        <text class="logo-word" x="10" y="40" font-family="Inter, sans-serif" font-weight="600" font-size="32">Nutra</text>
        <text class="logo-mark" x="105" y="40" font-family="Inter, sans-serif" font-weight="600" font-size="32">MEA</text>
        <path class="logo-rule" d="M10 50 Q 100 60 180 45" stroke-width="3" stroke-linecap="round" fill="none"/>
      </svg>
    </a>

    <button class="menu-toggle" type="button" id="menu-toggle" aria-expanded="false" aria-controls="site-nav">
      <svg data-icon="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 6h16"/><path d="M4 12h16"/><path d="M4 18h16"/>
      </svg>
      <svg data-icon="close" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" hidden>
        <path d="M18 6 6 18"/><path d="m6 6 12 12"/>
      </svg>
      <span class="visually-hidden">{{menu}}</span>
    </button>

    <nav class="site-nav" id="site-nav" aria-label="{{navLabel}}">
{{navLinks}}
      <span class="lang">
{{langLinks}}
      </span>
    </nav>
  </div>
</header>

<main id="main">
{{body}}
</main>

<footer class="site-footer">
  <div class="wrap">
    <p>{{footerText}}</p>
    <nav class="footer-links" aria-label="{{footerLabel}}">
      <a href="{{base}}contact/">{{contact}}</a>
      <a href="{{base}}privacy/">{{privacy}}</a>
    </nav>
  </div>
</footer>

<script src="{{base}}assets/nutramea.js" defer></script>
</body>
</html>
