name: Deploy meetings to nutrameaint.com

# Ships ONLY this feature's files into the live theme. It never touches the
# rest of the theme, never deletes anything, and never runs unless the tests
# pass first.
#
# Credentials live in GitHub repository secrets (Settings -> Secrets and
# variables -> Actions), encrypted at rest and never visible in logs or in a
# conversation:
#
#   FTP_SERVER    e.g. ftp.nutrameaint.com   (or the Hostinger FTP host)
#   FTP_USERNAME  the FTP/SFTP user
#   FTP_PASSWORD  that user's password
#   FTP_PROTOCOL  optional: "ftps" (default) or "sftp"
#   THEME_PATH    optional: defaults to the standard Hostinger path below
#
# Until those exist the job stops with an explanation rather than failing.

on:
  # Automatic: any change to the feature on main ships itself.
  push:
    branches: [ main ]
    paths:
      - 'site/meet/**'
      - 'theme/**'
      - '.github/workflows/deploy-theme.yml'
  # Manual: defaults to a dry run, so a deliberate deploy is a deliberate act.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List what would be uploaded, upload nothing'
        type: boolean
        default: true

concurrency:
  group: deploy-theme
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # A push to main is an intentional release and uploads. A manual run
      # honours the checkbox, which is ticked by default — so someone clicking
      # "Run workflow" to see what happens does not ship anything.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          coverage: none

      # Nothing reaches the live site unless everything passes here.
      - name: Verify before deploying
        run: npm run check

      - name: Check for credentials
        id: creds
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
        run: |
          if [ -z "$FTP_SERVER" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No FTP_SERVER secret set — nothing was deployed."
            echo "Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD under"
            echo "Settings -> Secrets and variables -> Actions, then run this again."
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # Assemble exactly what ships, so the upload step cannot pick up
      # anything else in the repository by accident.
      - name: Stage the theme files
        if: steps.creds.outputs.ready == 'true'
        run: |
          set -euo pipefail
          rm -rf .deploy && mkdir -p .deploy/woocommerce/myaccount
          cp -r site/meet .deploy/nutramea-meet
          # Development fixtures are not part of the theme.
          rm -f .deploy/nutramea-meet/embed-harness.html
          rm -f .deploy/nutramea-meet/dashboard-preview.html
          cp theme/nutramea-meetings.php .deploy/
          cp theme/woocommerce/myaccount/dashboard.php .deploy/woocommerce/myaccount/
          echo "Staged:"
          find .deploy -type f | sort | sed 's/^/  /'
          echo "Total: $(find .deploy -type f | wc -l) files"

      - name: Dry run summary
        if: steps.creds.outputs.ready == 'true' && env.DRY_RUN == 'true'
        run: |
          echo "::notice::Dry run — nothing was uploaded."
          echo "Untick 'dry_run' to deploy, or push to main."

      - name: Upload to the theme
        if: steps.creds.outputs.ready == 'true' && env.DRY_RUN != 'true'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: ./.deploy/
          server-dir: ${{ secrets.THEME_PATH || '/public_html/wp-content/themes/nutramea-theme/' }}
          # Additive only. Without this the action would mirror the directory
          # and delete the rest of the theme.
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**

      # The one step a file upload cannot do on its own, automated so nobody
      # has to hand-edit a live theme file.
      #
      # Safety: the original is backed up on the server before anything is
      # written, the line is only appended when absent, the result is syntax
      # checked here before it is sent, and if the site stops responding
      # afterwards the original goes straight back.
      - name: Enable the feature in functions.php
        if: steps.creds.outputs.ready == 'true' && env.DRY_RUN != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          THEME_DIR: ${{ secrets.THEME_PATH || '/public_html/wp-content/themes/nutramea-theme/' }}
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq lftp

          # ssl-force keeps the credentials off the wire in plaintext.
          # Certificate verification is relaxed only because shared hosts
          # commonly present a certificate for the server, not the customer's
          # own domain.
          OPTS="set ftp:ssl-force true; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 20"

          echo "Fetching the current functions.php…"
          lftp -c "$OPTS; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; get '${THEME_DIR}functions.php' -o functions.php"

          if grep -q "nutramea-meetings.php" functions.php; then
            echo "::notice::Already enabled — functions.php left untouched."
            exit 0
          fi

          cp functions.php functions.original.php
          cat >> functions.php <<'PHPLINE'

// NutraMEA member meetings. Delete this line to disable the feature entirely.
require_once get_stylesheet_directory() . '/nutramea-meetings.php';
PHPLINE

          # Validate before it ever reaches the site.
          php -l functions.php

          echo "Backing up the original on the server, then writing…"
          lftp -c "$OPTS; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; \
            put functions.original.php -o '${THEME_DIR}functions.php.nutramea-backup'; \
            put functions.php -o '${THEME_DIR}functions.php'"

          echo "Checking the site survived…"
          sleep 8
          code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' https://nutrameaint.com/ || echo 000)
          if [ "$code" != "200" ]; then
            echo "::error::Home page returned $code — restoring the original functions.php."
            lftp -c "$OPTS; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; put functions.original.php -o '${THEME_DIR}functions.php'"
            echo "Original restored. The site should be back as it was."
            exit 1
          fi
          echo "::notice::Feature enabled and the site is healthy."

      - name: Check the live page responds
        if: steps.creds.outputs.ready == 'true' && env.DRY_RUN != 'true'
        run: |
          set -euo pipefail
          echo "Waiting for the upload to settle…"
          sleep 10
          # Signed out, /meetings/ should redirect to the login page. A 200 with
          # the app on it would mean the sign-in gate is not working; a 404
          # means permalinks still need re-saving.
          code=$(curl -sS -o /dev/null -m 30 -w '%{http_code}' https://nutrameaint.com/meetings/ || echo 000)
          echo "GET /meetings/ -> $code"
          case "$code" in
            30*) echo "::notice::Live and gated correctly (redirects to sign-in)." ;;
            200) echo "::warning::200 while signed out — check the sign-in gate." ;;
            404) echo "::warning::404 — sign in to wp-admin once, or re-save Settings -> Permalinks." ;;
            *)   echo "::warning::Unexpected status $code — check the site." ;;
          esac

      # Health check, and a rescue if it fails.
      #
      # The home page is NOT a valid health check on this site: LiteSpeed keeps
      # serving a cached copy long after PHP has started throwing fatal errors,
      # so a dead site reports 200. This is not hypothetical — it masked a real
      # outage where every dynamic page was down while the home page looked
      # fine. wp-login.php is never cached, so it tells the truth.
      - name: Confirm the site is genuinely healthy
        if: steps.creds.outputs.ready == 'true' && env.DRY_RUN != 'true'
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          THEME_DIR: ${{ secrets.THEME_PATH || '/public_html/wp-content/themes/nutramea-theme/' }}
        run: |
          set -euo pipefail
          OPTS="set ftp:ssl-force true; set ssl:verify-certificate no; set net:max-retries 3; set net:timeout 20"

          health() {
            curl -sS -o /dev/null -m 30 -w '%{http_code}' https://nutrameaint.com/wp-login.php || echo 000
          }

          code=$(health)
          echo "GET /wp-login.php -> $code"
          if [ "$code" = "200" ]; then
            echo "::notice::Site healthy — sign-in is serving normally."
            exit 0
          fi

          # Something we shipped is fatal. Take the feature back out rather than
          # leave the site down: a missing feature is recoverable, an unusable
          # site is not.
          echo "::error::Sign-in returned $code. Removing the feature to restore the site."
          lftp -c "$OPTS; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; get '${THEME_DIR}functions.php' -o functions.php"
          grep -v "nutramea-meetings.php" functions.php > functions.rescued.php
          grep -v "NutraMEA member meetings" functions.rescued.php > functions.clean.php
          php -l functions.clean.php
          lftp -c "$OPTS; open -u '$FTP_USERNAME','$FTP_PASSWORD' '$FTP_SERVER'; put functions.clean.php -o '${THEME_DIR}functions.php'"

          sleep 8
          after=$(health)
          echo "After rescue, GET /wp-login.php -> $after"
          if [ "$after" = "200" ]; then
            echo "::error::Site restored, feature removed. Investigate before redeploying."
          else
            echo "::error::Still unhealthy after rescue — the cause is NOT this feature. Check the host."
          fi
          exit 1
