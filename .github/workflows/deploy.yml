name: Deploy NutraMEA site

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:

jobs:
  design-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check site against DESIGN_RULES.md
        run: ./tools/design-check.sh

  build-and-deploy:
    needs: design-check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        working-directory: ./site
        run: npm ci
      - name: Build (noop)
        working-directory: ./site
        run: npm run build
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
