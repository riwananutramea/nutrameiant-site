<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutraMEA Weekly Brief</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a0c0b'/%3E%3Ctext x='16' y='22' font-family='sans-serif' font-size='16' font-weight='700' fill='%23b9ff39' text-anchor='middle'%3EN%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --bg: #0a0c0b;
    --panel: #111512;
    --text: #f3f5f3;
    --soft: #d8ddd9;
    --muted: #98a099;
    --accent: #b9ff39;
    --accent-hover: #a1e622;
    --line: rgba(185, 255, 57, 0.16);
    --border-soft: rgba(255, 255, 255, 0.1);
    --error: #ffaaa8;
    --font-inter: 'Inter', system-ui, -apple-system, sans-serif;
    --font-ar: Tahoma, 'Arial', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background-color: var(--bg); color: var(--text); font-family: var(--font-inter); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }
  .mobile-header {
    display: flex; align-items: center; justify-content: space-between; padding: 12px 16px; background: var(--panel); border-bottom: 1px solid var(--border-soft);
  }
  .hamburger { font-size: 24px; background: none; border: none; color: var(--text); cursor: pointer; }
  .logo-link { display: inline-block; width: 120px; }
  .logo-svg { width: 100%; height: auto; }
  .lang-switcher { display: flex; gap: 8px; }
  .lang-btn { background: none; border: none; color: var(--muted); padding: 4px 8px; border-radius: 4px; }
  .lang-btn[aria-pressed="true"] { color: var(--accent); }
  @media (max-width: 620px) { body::before { display: none; } }
</style>
</head>
<body>
<header class="mobile-header">
  <button class="hamburger" aria-label="Menu" id="hamburger-btn">☰</button>
  <a href="/" class="logo-link" aria-label="NutraMEA home">
    <svg class="logo-svg" viewBox="0 0 200 60" fill="none" xmlns="http://www.w3.org/2000/svg">
      <text x="10" y="40" font-family="Inter" font-weight="700" font-size="32" fill="#ffffff">Nutra</text>
      <text x="105" y="40" font-family="Inter" font-weight="700" font-size="32" fill="#b9ff39">MEA</text>
      <path d="M10 50 Q 100 60 180 45" stroke="#b9ff39" stroke-width="3" stroke-linecap="round" fill="none"/>
    </svg>
  </a>
  <div class="lang-switcher" role="group" aria-label="Language Switcher">
    <button class="lang-btn" data-lang="en" aria-pressed="true">EN</button>
    <button class="lang-btn" data-lang="ar" aria-pressed="false">عربي</button>
    <button class="lang-btn" data-lang="zh" aria-pressed="false">中文</button>
  </div>
</header>
<main class="home">
  <h1>NutraMEA Intelligence</h1>
  <p>B2B intelligence for the nutraceuticals sector across the Middle East.</p>
  <p><a class="home__cta" href="./meet/">Member meetings &rarr;</a></p>
</main>
<style>
  .home { padding: 40px 20px; max-width: 640px; }
  .home h1 { font-size: 26px; margin-bottom: 10px; }
  .home p { color: var(--soft); margin-bottom: 14px; }
  .home__cta {
    display: inline-block; margin-top: 8px; padding: 12px 20px;
    background: var(--accent); color: var(--bg); border-radius: 8px;
    font-weight: 600; text-decoration: none;
  }
</style>
</body>
</html>
